name: Santa Preview Smoke

on:
  push:
    branches:
      - feature/santa-booking-scheduler
    paths:
      - .github/workflows/santa-preview-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check preview availability endpoint
        run: |
          status=$(curl -sS -o /tmp/availability.json -w "%{http_code}" \
            "https://santa-jim-hope-site-myy7hq5cb-teddster.vercel.app/api/santa/availability")
          cat /tmp/availability.json
          echo
          echo "availability_status=$status"
          test "$status" = "200"

      - name: Submit controlled preview booking request
        run: |
          status=$(curl -sS -o /tmp/booking.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"_honey":"","eventType":"photo-session","preferredDate":"2026-11-10","startTime":"10:00","name":"Side Quest Scheduler Test","email":"scheduler-test@example.com","phone":"","location":"Gonzales, LA","guestCount":"1","notes":"Automated preview smoke test — safe to delete."}' \
            "https://santa-jim-hope-site-myy7hq5cb-teddster.vercel.app/api/santa/bookings")
          cat /tmp/booking.json
          echo
          echo "booking_status=$status"
          test "$status" = "201"
