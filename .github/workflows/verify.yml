name: Verify

on:
  push:
    branches:
      - main
      - feature/santa-booking-scheduler
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test
      - name: Build
        run: npm run build
      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
